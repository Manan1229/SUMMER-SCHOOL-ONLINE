<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Greeting</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calc-container">
    <div class="calc-display" id="output">Enter Name & Age</div>
    <div class="calc-keys">
      <input class="calc-btn" id="name" type="text" placeholder="Name">
      <input class="calc-btn" id="age" type="number" placeholder="Age">
      <button class="calc-btn func wide" id="greetBtn">Greet</button>
    </div>
  </div>
  <script src="js/output.js" defer></script>
  <script src="js/greeting.js" defer></script>
</body>
</html>
