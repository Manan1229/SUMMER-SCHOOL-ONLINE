<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Callbacks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calc-container">
    <div class="calc-display" id="output">Pick Op</div>
    <div class="calc-keys">
      <input class="calc-btn" id="cbNum" type="number" value="5">
      <select class="calc-btn" id="cbType">
        <option value="double">Double</option>
        <option value="triple">Triple</option>
      </select>
      <button class="calc-btn func wide" id="btnCb">Go→</button>
    </div>
  </div>
  <script src="js/output.js" defer></script>
  <script src="js/callbacks.js" defer></script>
</body>
</html>
