<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Functions</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calc-container">
    <div class="calc-display" id="output">Enter Values</div>
    <div class="calc-keys">
      <input class="calc-btn" id="addA" type="number" placeholder="a">
      <input class="calc-btn" id="addB" type="number" placeholder="b">
      <button class="calc-btn func" id="btnAdd">Sum→</button>

      <input class="calc-btn" id="sqrN" type="number" placeholder="n">
      <button class="calc-btn func wide" id="btnSqr">Square→</button>

      <input class="calc-btn" id="fnName" type="text" placeholder="Name">
      <button class="calc-btn func wide" id="btnGreetFn">Greet→</button>
    </div>
  </div>
  <script src="js/output.js" defer></script>
  <script src="js/functions.js" defer></script>
</body>
</html>
