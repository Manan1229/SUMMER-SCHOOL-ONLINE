<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loops</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calc-container">
    <div class="calc-display" id="output">Set Range</div>
    <div class="calc-keys">
      <input class="calc-btn" id="forStart" type="number" value="1" placeholder="for start">
      <input class="calc-btn" id="forEnd"   type="number" value="10" placeholder="for end">
      <button class="calc-btn func" id="runFor">For→</button>

      <input class="calc-btn" id="whileStart" type="number" value="2" placeholder="while start">
      <input class="calc-btn" id="whileEnd"   type="number" value="20" placeholder="while end">
      <button class="calc-btn func" id="runWhile">While→</button>

      <input class="calc-btn" id="doStart" type="number" value="10" placeholder="do start">
      <input class="calc-btn" id="doEnd"   type="number" value="1" placeholder="do end">
      <button class="calc-btn func" id="runDo">Do…While→</button>
    </div>
  </div>
  <script src="js/output.js" defer></script>
  <script src="js/loops.js" defer></script>
</body>
</html>
